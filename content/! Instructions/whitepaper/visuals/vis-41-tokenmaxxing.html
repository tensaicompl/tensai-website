<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIS-41 — $150K/month on Claude Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAFAFA;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .card {
    background: #F1F5F9;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 56px 48px;
    text-align: center;
  }

  .number {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 64px;
    line-height: 1;
    color: #6D28D9;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .number-unit {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #0F172A;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .context {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    color: #334155;
  }

  @media (max-width: 480px) {
    .number { font-size: 48px; }
    .card { padding: 44px 28px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="number">$150K</div>
  <div class="number-unit">per month</div>
  <div class="context">A single developer's monthly AI spend. Without cost governance, agentic AI budgets are unbounded.</div>
</div>

</body>
</html>
