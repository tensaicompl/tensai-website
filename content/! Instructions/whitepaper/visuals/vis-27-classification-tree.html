<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIS-27 — AI System Classification Decision Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAFAFA;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .frame {
    width: 800px;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 4px;
    padding: 48px 40px 36px;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #0F172A;
    text-align: center;
    letter-spacing: 0.02em;
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  .tree-svg {
    width: 100%;
    display: block;
  }

  .caption {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: #6B7280;
    text-align: center;
    margin-top: 28px;
    line-height: 1.5;
    padding-top: 16px;
    border-top: 1px solid #E2E8F0;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="title">AI System Classification Decision Tree</div>

  <svg class="tree-svg" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- START NODE -->
    <rect x="260" y="8" rx="16" ry="16" width="200" height="40" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>
    <text x="360" y="33" font-family="Montserrat, sans-serif" font-size="12" fill="#0F172A" font-weight="700" text-anchor="middle">AI System to Classify</text>

    <!-- Connector: Start -> Decision 1 -->
    <line x1="360" y1="48" x2="360" y2="80" stroke="#0F172A" stroke-width="1"/>
    <polygon points="356,76 360,84 364,76" fill="#0F172A"/>

    <!-- DECISION 1 (diamond) -->
    <polygon points="360,88 530,148 360,208 190,148" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="360" y="140" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">Subliminal techniques,</text>
    <text x="360" y="153" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">exploit vulnerabilities,</text>
    <text x="360" y="166" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">or social scoring?</text>

    <!-- YES branch -> Prohibited -->
    <line x1="530" y1="148" x2="620" y2="148" stroke="#0F172A" stroke-width="1"/>
    <polygon points="616,144 624,148 616,152" fill="#0F172A"/>
    <text x="560" y="140" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">YES</text>

    <!-- PROHIBITED terminal -->
    <rect x="624" y="124" rx="12" ry="12" width="90" height="48" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="669" y="146" font-family="Montserrat, sans-serif" font-size="12" fill="#6D28D9" font-weight="800" text-anchor="middle">Prohibited</text>
    <text x="669" y="162" font-family="Inter, sans-serif" font-size="8" fill="#6D28D9" text-anchor="middle" font-weight="500">Banned outright</text>

    <!-- NO branch -> Decision 2 -->
    <line x1="360" y1="208" x2="360" y2="240" stroke="#0F172A" stroke-width="1"/>
    <polygon points="356,236 360,244 364,236" fill="#0F172A"/>
    <text x="348" y="228" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">NO</text>

    <!-- DECISION 2 -->
    <polygon points="360,248 510,300 360,352 210,300" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="360" y="293" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">Operates in high-risk</text>
    <text x="360" y="306" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">domain (Annex III)?</text>

    <!-- YES branch -> High-Risk -->
    <line x1="510" y1="300" x2="620" y2="300" stroke="#0F172A" stroke-width="1"/>
    <polygon points="616,296 624,300 616,304" fill="#0F172A"/>
    <text x="550" y="292" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">YES</text>

    <!-- HIGH-RISK terminal -->
    <rect x="624" y="272" rx="12" ry="12" width="90" height="56" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="669" y="295" font-family="Montserrat, sans-serif" font-size="12" fill="#0F172A" font-weight="800" text-anchor="middle">High-Risk</text>
    <text x="669" y="310" font-family="Inter, sans-serif" font-size="8" fill="#334155" text-anchor="middle" font-weight="500">~30 controls</text>
    <text x="669" y="322" font-family="Inter, sans-serif" font-size="8" fill="#334155" text-anchor="middle" font-weight="500">Conformity assessment</text>

    <!-- NO branch -> Decision 3 -->
    <line x1="360" y1="352" x2="360" y2="384" stroke="#0F172A" stroke-width="1"/>
    <polygon points="356,380 360,388 364,380" fill="#0F172A"/>
    <text x="348" y="372" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">NO</text>

    <!-- DECISION 3 -->
    <polygon points="360,392 510,440 360,488 210,440" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="360" y="433" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">Generates content,</text>
    <text x="360" y="446" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">interacts with humans,</text>
    <text x="360" y="459" font-family="Inter, sans-serif" font-size="10" fill="#0F172A" font-weight="500" text-anchor="middle">or processes biometrics?</text>

    <!-- YES branch -> Limited Risk -->
    <line x1="510" y1="440" x2="620" y2="440" stroke="#0F172A" stroke-width="1"/>
    <polygon points="616,436 624,440 616,444" fill="#0F172A"/>
    <text x="550" y="432" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">YES</text>

    <!-- LIMITED RISK terminal -->
    <rect x="624" y="416" rx="12" ry="12" width="90" height="48" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="669" y="436" font-family="Montserrat, sans-serif" font-size="11" fill="#0F172A" font-weight="800" text-anchor="middle">Limited Risk</text>
    <text x="669" y="452" font-family="Inter, sans-serif" font-size="8" fill="#334155" text-anchor="middle" font-weight="500">Transparency obligations</text>

    <!-- NO branch -> Minimal Risk -->
    <line x1="210" y1="440" x2="96" y2="440" stroke="#0F172A" stroke-width="1"/>
    <polygon points="100,436 92,440 100,444" fill="#0F172A"/>
    <text x="165" y="432" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="600">NO</text>

    <!-- MINIMAL RISK terminal -->
    <rect x="4" y="416" rx="12" ry="12" width="88" height="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="48" y="436" font-family="Montserrat, sans-serif" font-size="11" fill="#0F172A" font-weight="800" text-anchor="middle">Minimal Risk</text>
    <text x="48" y="452" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle" font-weight="500">Voluntary codes</text>

    <!-- Penalty annotation -->
    <rect x="624" y="496" rx="3" ry="3" width="90" height="44" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="669" y="513" font-family="Montserrat, sans-serif" font-size="9" fill="#0F172A" font-weight="700" text-anchor="middle">Penalties</text>
    <text x="669" y="528" font-family="Inter, sans-serif" font-size="8" fill="#334155" text-anchor="middle">Up to EUR 35M</text>
    <text x="669" y="538" font-family="Inter, sans-serif" font-size="8" fill="#334155" text-anchor="middle">or 7% of revenue</text>
    <line x1="669" y1="472" x2="669" y2="496" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,2"/>

  </svg>

  <div class="caption">The AI System Classification Decision Tree. A practical flowchart for classifying AI systems against EU AI Act risk tiers. Over-classification creates unnecessary burden; under-classification creates regulatory exposure.</div>
</div>
</body>
</html>
