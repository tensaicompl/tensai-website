<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIS-10 — 80--95% of AI projects fail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAFAFA;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .card {
    background: #F1F5F9;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    padding: 64px 56px;
    text-align: center;
  }

  .line-one {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1.15;
    color: #0F172A;
    letter-spacing: -0.025em;
  }

  .line-one .accent {
    color: #6D28D9;
  }

  .line-two {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.3;
    color: #0F172A;
    margin-top: 16px;
    letter-spacing: -0.015em;
  }

  @media (max-width: 600px) {
    .line-one { font-size: 36px; }
    .line-two { font-size: 22px; }
    .card { padding: 48px 32px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="line-one"><span class="accent">80--95%</span> of AI projects fail.</div>
  <div class="line-two">The technology works.<br>The organisations do not.</div>
</div>

</body>
</html>
