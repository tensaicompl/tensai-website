<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIS-05 — 88% adopt. 6% see impact.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAFAFA;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .card {
    background: #F1F5F9;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    padding: 64px 56px;
    text-align: center;
  }

  .quote-line {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1.15;
    color: #0F172A;
    letter-spacing: -0.025em;
  }

  .quote-line .accent {
    color: #6D28D9;
  }

  .context {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    color: #334155;
    margin-top: 28px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .source {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: #9CA3AF;
    margin-top: 24px;
  }

  @media (max-width: 600px) {
    .quote-line { font-size: 38px; }
    .card { padding: 48px 32px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="quote-line">88% adopt.</div>
  <div class="quote-line"><span class="accent">6%</span> see impact.</div>

  <div class="context">The gap between AI adoption and AI value is the defining challenge of enterprise technology in 2026.</div>

  <div class="source">(McKinsey Global Survey on AI, 2025)</div>
</div>

</body>
</html>
